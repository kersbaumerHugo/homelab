name: OPNsense NAT desired-state checks

on:
  pull_request:
    paths:
      - 'network/voice-pe.yml'
      - 'scripts/opnsense-nat-plan.py'
      - 'scripts/verify-voice-pe.py'
      - 'tests/test_opnsense_nat_plan.py'
      - 'Makefile'
      - '.github/workflows/opnsense-nat-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-nat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python scripts/verify-voice-pe.py validate
      - run: python -m unittest discover -s tests -p 'test_opnsense_nat_plan.py' -v
      # Deliberately no API credentials, CA or live network access.
