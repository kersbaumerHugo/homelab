name: Voice PE desired state

on:
  pull_request:
    paths:
      - 'network/voice-pe.yml'
      - 'scripts/verify-voice-pe.py'
      - 'scripts/backup-opnsense-encrypted.sh'
      - 'tests/test_voice_pe.py'
      - '.github/workflows/voice-pe-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python scripts/verify-voice-pe.py validate
      - run: python -m unittest discover -s tests -p 'test_voice_pe.py' -v
      - run: bash -n scripts/backup-opnsense-encrypted.sh
