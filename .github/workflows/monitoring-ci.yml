name: Monitoring CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            shellcheck \
            jq \
            python3-yaml \
            prometheus

      - name: Validate monitoring repository
        run: |
          chmod +x scripts/validate-monitoring.sh
          ./scripts/validate-monitoring.sh
