name: Monitoring CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            shellcheck \
            jq \
            python3-yaml \
            prometheus

      - name: Validate monitoring repository
        run: |
          chmod +x scripts/validate-monitoring.sh
          ./scripts/validate-monitoring.sh
  grafana-integration:
    name: Grafana integration
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Grafana with repository provisioning
        run: |
          docker run -d \
            --name grafana-test \
            -p 3000:3000 \
            -v "${{ github.workspace }}/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro" \
            -v "${{ github.workspace }}/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro" \
            grafana/grafana:13.2.0

      - name: Wait for Grafana
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Grafana is healthy"
              exit 0
            fi

            echo "Waiting for Grafana... ($attempt/30)"
            sleep 2
          done

          echo "Grafana failed to become healthy"
          docker logs grafana-test
          exit 1

      - name: Verify Grafana health
        run: |
          HEALTH="$(curl --fail --silent \
            http://127.0.0.1:3000/api/health)"

          echo "$HEALTH"

          echo "$HEALTH" | grep -q '"database": "ok"\|"database":"ok"'

      - name: Show Grafana logs on failure
        if: failure()
        run: docker logs grafana-test

      - name: Stop Grafana
        if: always()
        run: docker rm -f grafana-test || true
