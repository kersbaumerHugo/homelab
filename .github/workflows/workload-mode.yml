name: Workload mode safety

on:
  pull_request:
    paths:
      - 'scripts/workload-mode.sh'
      - 'scripts/test-workload-mode.sh'
      - '.github/workflows/workload-mode.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/workload-mode.sh'
      - 'scripts/test-workload-mode.sh'
      - '.github/workflows/workload-mode.yml'

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/workload-mode.sh scripts/test-workload-mode.sh
      - name: Mocked operational tests
        run: bash scripts/test-workload-mode.sh
