vmid: 105
name: gtnh01
type: qemu

os:
  template: local:vmtemplate/centos-stream9.tar.zst
  ostype: centos

resources:
  cores: 4
  memory_mib: 8192
  swap_mib: 512
  rootfs:
    storage: local-lvm
    size_gib: 40

network:
  interface: eth0
  bridge: vmbr0
  ipv4: dhcp:192.168.10.165
  gateway4: 192.168.10.1

security:
  secureboot: false
  iommu: false

boot:
  onboot: true
  order: 50
  startup_delay_seconds: 15
  shutdown_timeout_seconds: 60

status: stopped
purpose: goldenhugo
